externalPostgres:
  enabled: false

postgresql:
  enabled: true
  name: postgres
  image:
    repository: langgenius/postgresql
    registry: docker.io
  global:
    storageClass: ""
    postgresql:
      auth:
        postgresPassword: "DifyLocalPassword123!"
        database: "dify"
  primary:
    persistence:
      enabled: true
      existingClaim: "{{DIFY_POSTGRES_PVC}}"
    initdb:
      scripts:
        my_init_script.sh: |
          #!/bin/bash
          set -e
          echo "Creating database..."
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -U postgres << 'EOF'
          SELECT 'CREATE DATABASE enterprise' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'enterprise')\gexec
          SELECT 'CREATE DATABASE audit' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'audit')\gexec
          SELECT 'CREATE DATABASE dify_plugin_daemon' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'dify_plugin_daemon')\gexec
          EOF

